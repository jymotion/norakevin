<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>RSVP &middot; Nora &amp; Kevin</title>
  <link rel="preload" href="/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script>document.documentElement.className += ' js';</script>
  <style>
    .rsvp label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    .rsvp input[type="text"], .rsvp textarea {
      width: 100%;
      font: inherit;
      padding: 0.6rem 0.8rem;
      border: 1px solid #666;
      border-radius: 2px;
      background: #fff;
      color: inherit;
    }
    .rsvp textarea { min-height: 7rem; resize: vertical; }
    .rsvp input:focus, .rsvp textarea:focus { outline: 3px solid var(--ink); outline-offset: 2px; }
    .rsvp button[disabled] { opacity: 0.6; cursor: wait; }
    .rsvp button.link {
      background: none; color: inherit; border: 0; font: inherit; text-decoration: underline;
      padding: 0.5rem 0; min-height: 2.75rem; cursor: pointer;
    }
    .rsvp .field { margin-bottom: 1.25rem; }
    /* Household: one row per guest, hairlines between, choices on the right. */
    .rsvp #people { margin-bottom: 1.75rem; border-top: 1px solid var(--line); }
    .rsvp .person {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.5rem 1rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--line);
    }
    .rsvp .person-name { font-size: 1.3rem; letter-spacing: 0.03em; }
    .rsvp .choices { display: flex; gap: 0.5rem; margin-left: auto; }
    /* Toggle buttons: tap to choose, tap the chosen one again to clear it. */
    .rsvp .choice {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 6.25rem; min-height: 2.75rem; padding: 0.35rem 0.9rem; margin: 0;
      border: 1px solid #8a8a8a; border-radius: 0;
      background: #fff; color: var(--ink);
      font: inherit; font-weight: 500; font-size: 0.95rem; letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer;
    }
    .rsvp .choice:hover { border-color: var(--ink); }
    .rsvp .choice[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    @media (max-width: 760px) {
      .rsvp .person { gap: 0.4rem 0.75rem; }
      .rsvp .person-name { font-size: 1.15rem; letter-spacing: 0.02em; }
      .rsvp .choices { gap: 0.375rem; }
      .rsvp .choice { min-width: 0; padding: 0.3rem 0.6rem; font-size: 0.8rem; letter-spacing: 0.08em; }
    }
    .rsvp .message { padding: 0.9rem 1rem; margin: 0 0 1.25rem; }
    .rsvp .message.error { background: #fdecea; color: #7a1a12; border: 1px solid #e0a39c; }
    .rsvp .message.success { background: #e9f5ec; color: #1c4d2a; border: 1px solid #9ccaa8; }
    .rsvp .demo { background: #fff6d6; border: 1px solid #e3c766; padding: 0.75rem 1rem; margin-bottom: 1.5rem; font-size: 1.1rem; }
    .rsvp #household-intro:empty { display: none; }
    .visually-hidden { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="subpage">
  <div class="page">
    <header class="topbar">
      <button type="button" class="menu-button" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">&#9776;</button>
      <a class="monogram" href="/">N&amp;K</a>
    </header>

    <header class="masthead">
      <p class="script">The wedding of</p>
      <p class="names"><a href="/">Nora &amp; Kevin</a></p>
    </header>

    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/schedule/">Schedule</a></li>
        <li><a href="/travel/">Travel</a></li>
        <li><a href="/registry/">Registry</a></li>
        <li><a href="/faq/">FAQ</a></li>
        <li><a href="/rsvp/" aria-current="page">RSVP</a></li>
      </ul>
    </nav>

    <main class="content rsvp">
      <h1 class="page-title">RSVP</h1>

      <p class="demo" id="demo-banner" hidden>
        <strong>Demo mode:</strong> nothing is saved. Try the names <em>Alex Sample</em> or <em>Pat Example</em>.
      </p>

      <noscript>
        <p class="message error">This form needs JavaScript. You can text or call us to RSVP instead.</p>
      </noscript>

      <div id="message" role="alert" hidden></div>

      <form id="lookup-form" hidden>
        <div class="field">
          <label for="name">Your full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="visually-hidden" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit" class="button">Find my invitation</button>
      </form>

      <form id="household-form" hidden novalidate>
        <p id="household-intro"></p>
        <div id="people"></div>
        <div class="field">
          <label for="note">Leave a message for Nora &amp; Kevin (optional)</label>
          <textarea id="note" name="note" maxlength="1000"></textarea>
        </div>
        <button type="submit" class="button">Send RSVP</button>
        <p><button type="button" class="link" id="start-over">Not you? Search again</button></p>
      </form>

      <div id="done" hidden>
        <p><button type="button" class="button" id="edit-again">Change our RSVP</button></p>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <img src="/images/heart.svg" alt="" width="91" height="160">
  </footer>
  <script src="/site.js"></script>
  <script src="rsvp.js"></script>
</body>
</html>
